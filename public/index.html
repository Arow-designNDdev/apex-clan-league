:root{--cy:#0ff5d4;--disp:"Tektur",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--sans:"Inter",Arial,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;color:#fff;font:14px/1.4 var(--sans);background:linear-gradient(#060b11cc,#060b11e6),url(/assets/b94b37fa12.jpg) center top/cover fixed #060b11}
.page{max-width:1240px;margin:0 auto;padding:22px 18px 120px;position:relative}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{width:78px;height:78px}
.ttl{flex:1;min-width:220px}
h1{margin:0;font:900 clamp(30px,6vw,64px)/1 var(--disp);color:#1fd6b4;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 0 24px #0ff5d455}
.sub{font:500 12px var(--mono);letter-spacing:.18em;color:#9fb4b0;text-transform:uppercase;margin-top:6px}
.mode{display:flex;border:1px solid #0ff5d473;border-radius:999px;padding:3px;background:#05101699}
.mode button{border:0;background:none;color:#9fb4b0;font:700 12px var(--mono);letter-spacing:.1em;padding:8px 16px;border-radius:999px;cursor:pointer;text-transform:uppercase}
.mode button.on{background:var(--cy);color:#04221e}
.tabs{display:flex;gap:8px;margin:22px 0 10px;overflow-x:auto;padding-bottom:4px}
.tab{border:1px solid #ffffff22;background:#ffffff0d;color:#c9d6d3;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:9px 18px;border-radius:999px;white-space:nowrap}
.tab.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 16px #0ff5d440,inset 0 0 12px #0ff5d41a}
.tab.off{opacity:.45}
.ghostbar{display:none;align-items:center;gap:10px;margin:8px 0;color:#9fb4b0;font:500 12px var(--mono)}
body.leader .ghostbar{display:flex}
.ghostbar select{background:#071a18;color:#fff;border:1px solid #0ff5d473;border-radius:8px;padding:5px 8px;font:inherit}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,3vw,40px);margin:34px 0 26px;flex-wrap:wrap}
.pc{position:relative;width:clamp(230px,28vw,340px);background:radial-gradient(120% 80% at 50% 38%,#17504a,#123b36 55%,#0e2f2c);clip-path:polygon(0 0,100% 0,100% 80%,86% 100%,0 100%);padding:14px 18px 16px;display:flex;flex-direction:column}
.pc.p1{min-height:clamp(380px,40vw,480px)}.pc.p2{min-height:clamp(340px,35vw,430px)}.pc.p3{min-height:clamp(300px,31vw,380px)}
.pc .n{font:900 clamp(54px,8vw,100px)/.9 var(--disp);color:#fff}
.pc .bd{position:absolute;right:14px;top:14px;width:clamp(44px,6vw,70px)}
.pc .th{height:clamp(150px,18vw,235px);max-width:82%;object-fit:contain;margin:0 auto;display:block;filter:drop-shadow(0 8px 14px #0008)}
.pc .nm{font:700 56px/1 var(--mono);margin-top:auto;white-space:nowrap;width:max-content;max-width:none}
.pc .ln{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:6px}
.pc .cl{font:500 13px var(--mono);color:#d9ece8;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.pc .pts{font:700 clamp(22px,3vw,40px)/1 var(--mono);padding-right:clamp(14px,3vw,34px)}.pc .pts small{font-size:.5em}
.pc .tr{font:600 10px var(--mono);letter-spacing:.14em;color:var(--cy);text-transform:uppercase;margin-top:6px}
.blk{margin:34px 0 0}
.bh{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.bh b{font:900 20px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}
.bh i{font:500 12px var(--mono);color:#9fb4b0;font-style:normal;letter-spacing:.14em}
.bh:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--ac),transparent);filter:drop-shadow(0 0 5px var(--ac))}
.scr{overflow-x:auto;padding-bottom:6px}
.grid{display:grid;grid-template-columns:var(--cols);align-items:center;gap:10px}
.hd{display:grid;grid-template-columns:84px 1fr;min-width:960px;margin-bottom:6px;font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#7f948f}
.hd>:first-child{text-align:center}
.hi,.rb{display:grid;grid-template-columns:var(--c2);align-items:center;gap:10px}
.hi{padding:0 19px 0 12px}
.blk{--c2:1.5fr 1.2fr 84px 74px 56px 72px 64px 150px 100px}
.hi>:nth-child(n+3):nth-child(-n+8),.rb>:nth-child(n+3):nth-child(-n+8){justify-self:center;text-align:center}
.hi>:last-child,.rb>:last-child{width:100px;justify-self:end;text-align:center}
.thc{display:flex;align-items:center;justify-content:center;gap:6px}
.thc img{width:36px;height:32px;object-fit:contain}
.row{display:grid;grid-template-columns:84px 1fr;min-width:960px;margin-bottom:8px;height:var(--rh,60px)}
.rt{background:var(--ac);color:#04221e;font:700 24px var(--disp);display:grid;place-items:center}
.rb{background:var(--bar);border:1px solid #ffffff14;border-left:0;clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);padding:0 18px 0 12px;display:grid;align-items:center;gap:10px;font:500 14px var(--mono)}
.rb:hover{filter:brightness(1.25)}
.who{display:flex;align-items:center;gap:10px;font:700 18px var(--mono);overflow:hidden;white-space:nowrap}
.who img{width:44px;height:40px;object-fit:contain}
.who small{font:500 11px var(--mono);color:#9fb4b0}
.cn{display:flex;align-items:center;gap:6px;color:#d4e3e0;text-transform:uppercase;font-size:12px;white-space:nowrap;overflow:hidden}
.m{color:#c6d6d3}.m b{color:#fff}
.chip{font:700 10px var(--mono);letter-spacing:.1em;padding:3px 9px;border-radius:999px;border:1px solid;text-transform:uppercase;justify-self:start}
.t-Elite{color:#ffc94d}.t-Excellent{color:var(--cy)}.t-Strong{color:#43e08f}.t-Solid{color:#b6c3ff}.t-Developing{color:#8da0b0}
.sb{justify-self:end;transform:skewX(-14deg);border:1px solid var(--ac);background:#00000040;padding:6px 16px;min-width:92px}
.sb span{display:block;transform:skewX(14deg);font:700 22px var(--mono);text-align:center}
.gt{font:600 9px var(--mono);letter-spacing:.14em;color:#04221e;background:#ffc94d;padding:1px 6px;border-radius:4px;margin-left:6px;display:none}
body.leader .gt{display:inline-block}
.g1{--ac:#0ff5d4;--bar:#0f3a35}.g2{--ac:#3a8dff;--bar:#101c33;--rh:52px}.g3{--ac:#a24bff;--bar:#1a1233;--rh:52px}.g4{--ac:#8aa0b4;--bar:#141b22;--rh:52px}
.g2 .rt,.g3 .rt,.g4 .rt{font-size:19px}
.g2 .rb,.g3 .rb,.g4 .rb{font-size:13px}.g2 .who,.g3 .who,.g4 .who{font-size:16px}
.ln2{position:fixed;left:0;right:0;bottom:0;height:70px;pointer-events:none;z-index:-1}
.ln2 path{fill:none;stroke:var(--cy);stroke-width:2;filter:drop-shadow(0 0 5px var(--cy))}
.note{color:#7f948f;font:500 11px var(--mono);margin-top:26px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@font-face{font-family:Spray;src:url(/assets/6bd6f221ff.woff2) format("woff2")}
.row[data-i],.pc[data-i]{cursor:pointer}
.ov{position:fixed;inset:0;z-index:50;background:#030a0e80;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}.ov.on{display:flex}
.pf{margin:auto;width:min(900px,100%);background:#dffcf6b0;padding:1px;clip-path:polygon(0 0,calc(100% - 96px) 0,100% 74px,100% 100%,116px 100%,0 calc(100% - 64px))}
.pi{position:relative;overflow:hidden;min-height:500px;padding:14px 30px 0;background:radial-gradient(80% 60% at 52% 42%,#0b4d46,#03332e 58%,#022a26);clip-path:polygon(0 0,calc(100% - 96px) 0,100% 74px,100% 100%,116px 100%,0 calc(100% - 64px));display:flex;flex-direction:column}
.ph{display:flex;justify-content:space-between;align-items:center;padding-right:110px}
.ptabs{display:flex;gap:6px}.ptabs button,.px{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#9fc7bf;background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer}
.ptabs button.on{color:var(--cy);border-color:var(--cy)}.px{font-size:16px}
.pg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.9fr);gap:10px;margin-top:10px;position:relative;flex:1}
.fbadge{width:62px;filter:drop-shadow(0 0 18px #ff8a3d66)}
.fname{font:800 66px/1.05 "Inter","Segoe UI Symbol","Segoe UI Emoji","Cambria Math","Nirmala UI","Yu Gothic",var(--sans);margin-top:10px;text-transform:uppercase;white-space:nowrap;width:max-content;max-width:none}
.fclan{display:flex;gap:8px;align-items:center;font:600 16px var(--mono);text-transform:uppercase;color:#d9ece8;margin-top:6px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;padding-bottom:10px;border-bottom:1px solid #2f6b8f}
.fr2 small,.fdl dt{display:block;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#7fb5ac}
.fr2 b{font:700 22px var(--disp)}.fr2 em{font-style:normal;font-size:16px;color:#7fb5ac}
.fdl{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;margin:16px 0 0}.fdl dd{margin:0;font:700 15px var(--mono)}
.pm{position:relative;min-height:300px;display:flex;align-items:flex-end;justify-content:center}
.spray{position:absolute;left:44%;top:46%;transform:translate(-50%,-50%) rotate(-5deg) scaleY(1.4);width:max-content;white-space:nowrap;font:400 84px/1 Spray,var(--disp);color:#08ffd9;opacity:1;z-index:0;pointer-events:none;filter:drop-shadow(0 0 22px #0ff5d455)}.pi{overflow-x:clip}
.fth{position:relative;z-index:2;width:min(100%,250px);max-height:230px;object-fit:contain;filter:drop-shadow(0 14px 22px #000a) drop-shadow(0 0 30px #1fd6b455);margin-bottom:12px}
.pq{text-align:center}.ovr b{display:block;font:900 42px/1 var(--disp);color:var(--cy);text-shadow:0 0 22px #0ff5d488}.ovr small{font:500 11px var(--mono);letter-spacing:.2em;color:#7fb5ac;text-transform:uppercase}
.rd{width:100%;max-width:250px;overflow:visible}.rg{fill:none;stroke:#2c6a62;stroke-width:1}
.rp{fill:#0ff5d447;stroke:var(--cy);stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 0 8px #0ff5d4);transform-origin:160px 150px;animation:pop .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes pop{from{transform:scale(.15);opacity:0}}
.rv{font:700 15px var(--mono);fill:#fff;text-anchor:middle}.rl{font:500 9px var(--mono);letter-spacing:.14em;fill:#7fb5ac;text-anchor:middle;text-transform:uppercase}
.pcm{display:none}.pbt{margin:10px -30px 0;padding:12px 30px 70px;background:#021214a8;border-top:1px solid #1d4d47}
.pt0,.pt1{display:grid;grid-template-columns:150px repeat(7,1fr);align-items:center}
.pt0{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#7fb5ac;padding-bottom:8px;border-bottom:1px solid #2f6b8f;margin-bottom:8px}
.pt0 span,.pt1 b{text-align:center}.pt0 span:first-child,.pt1 span{text-align:left}
.pt1{padding:7px 0;font:500 16px var(--mono)}.pt1 b{font:700 20px var(--mono)}.pt1:last-child{opacity:.6}
.pa{margin-top:16px;padding-bottom:76px}
.pa0,.pa1{display:grid;grid-template-columns:44px repeat(5,1fr) 70px 90px;gap:8px;padding:10px 4px;font:500 14px var(--mono);align-items:center;text-align:center}
.pa0{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7fb5ac;border-bottom:1px solid #2f6b8f}
.pa1{border-bottom:1px solid #0f4a43}.pa1 b{font-size:17px;color:var(--cy)}.stz{color:#ffc94d;letter-spacing:2px}

function exPlay(){cancelAnimationFrame(EXRAF);const t0=performance.now();const step=async now=>{const t=Math.min(1,(now-t0)/3400),o=$i('ex-cv');if(!o)return;const d=exPart(EXS.pv),sc=640/window.ApexExport.W;exDraw(o,d,sc,t);if(t<1)EXRAF=requestAnimationFrame(step)};EXRAF=requestAnimationFrame(step)}
async function exGo(copy){if(EXBUSY)return;EXBUSY=true;const bar=$i('ex-bar'),note=$i('ex-note'),go=$i('ex-go');go.disabled=true;
 try{await exData(EXS.n);const AXP=window.ApexExport,W=AXP.W,RG=exRanges(),multi=RG.length>1,ids=copy?[EXS.pv]:RG.map((_,k)=>k),sleep=ms=>new Promise(r=>setTimeout(r,ms));
  for(let q=0;q<ids.length;q++){const pi=ids[q],d=exPart(pi),L=AXP.layout(d),base='apex-clan-league-'+slug(d.season)+'-'+(multi?'image'+(pi+1)+'-ranks'+RG[pi][0]+'-'+RG[pi][1]:(EXS.n?'top'+EXS.n:'all')),tag=multi&&!copy?'Image '+(q+1)+' of '+ids.length+': ':'';
  if(EXS.f=='png'){const sc=EXS.sp,c=exCv(W*sc,L.H*sc);exDraw(c,d,sc,1);const b=await exBlob(c,'image/png');
   if(copy){try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Image copied')}catch(e){toast('Could not copy. Download it instead.')}}else exSave(b,base+'.png')}
  else if(EXS.f=='pdf'){const c=exCv(W,L.H);exDraw(c,d,1,1);const jb=await exBlob(c,'image/jpeg',.93),buf=new Uint8Array(await jb.arrayBuffer());exSave(new Blob([AXP.makePdf(buf,c.width,c.height)],{type:'application/pdf'}),base+'.pdf')}
  else{const gw=EXS.sg,sc=gw/W,gh=Math.round(L.H*sc),{GIFEncoder,quantize,applyPalette}=await import('/assets/gifenc.js'),c=exCv(gw,gh),N=34,gif=GIFEncoder();
   const fx=exDraw(c,d,sc,1),pal=quantize(fx.getImageData(0,0,gw,gh).data,256);
   for(let i=0;i<=N;i++){const x=exDraw(c,d,sc,i/N),idx=applyPalette(x.getImageData(0,0,gw,gh).data,pal);gif.writeFrame(idx,gw,gh,{palette:i==0?pal:undefined,delay:i==0?350:i==N?3200:55,repeat:0});
    bar.style.width=Math.round(i/N*100)+'%';note.textContent=tag+'Building frame '+(i+1)+' of '+(N+1)+'…';await new Promise(r=>setTimeout(r,0))}
   gif.finish();const b=new Blob([gif.bytes()],{type:'image/gif'});exSave(b,base+'.gif')}
  if(q<ids.length-1)await sleep(600)}
  if(!copy)toast(ids.length>1?ids.length+' files saved':EXS.f=='png'?'Image saved':EXS.f=='pdf'?'PDF saved':'GIF saved')
 }catch(e){toast('Export failed: '+(e.message||e))}
 EXBUSY=false;go.disabled=false;if($i('ex-bar'))$i('ex-bar').style.width='0';const nt=$i('ex-note');if(nt)nt.textContent=EXS.f=='gif'?'Done. Change the options to export again.':nt.textContent}
$i('ex').onclick=async e=>{const o=$i('ex');if(e.target===o||e.target.closest('#ex-x')){cancelAnimationFrame(EXRAF);o.classList.remove('on');return}
 const sg=e.target.closest('.seg button');if(sg&&!EXBUSY){const id=sg.parentElement.id,v=sg.dataset.v;if(id=='ex-n')EXS.n=+v;else if(id=='ex-p'){EXS.parts=+v;EXS.pv=0}else if(id=='ex-pv'){EXS.pv=+v}else if(id=='ex-f')EXS.f=v;else if(id=='ex-s'){if(EXS.f=='png')EXS.sp=+v;else EXS.sg=+v}o.innerHTML=exHTML();await exPreview(1);return}
 if(e.target.closest('#ex-pl')){await exData(EXS.n);exPlay();return}
 if(e.target.closest('#ex-go'))exGo(false);else if(e.target.closest('#ex-cp'))exGo(true)};
$i('ex').addEventListener('change',async e=>{const t=e.target;if(!t.classList||!t.classList.contains('exc')||EXBUSY)return;exNorm();EXS.cut[+t.dataset.ci]=+t.value;const k=+t.dataset.ci;for(let m=k+1;m<EXS.cut.length;m++)if(EXS.cut[m]<EXS.cut[m-1]+3)EXS.cut[m]=EXS.cut[m-1]+3;$i('ex').innerHTML=exHTML();await exPreview(1)});
$i('out').addEventListener('click',e=>{if(e.target.closest('#ex-open'))exOpen()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){cancelAnimationFrame(EXRAF);$i('ex').classList.remove('on')}});
const tick=()=>document.querySelectorAll('.gn').forEach(e=>{if(rng()<.3)e.textContent=crypt()});
render();document.getElementById('gc').onchange=()=>{CFG.ghosts=+$i('gc').value;mkCA();render()};
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(tick,180);
const sm=l=>{document.body.classList.toggle('leader',l);document.body.classList.toggle('supreme',!!l&&ROLE=='supreme');$i('lo').textContent=l&&WHO?'Log out · '+WHO:'Log out';mL.classList.toggle('on',l);mV.classList.toggle('on',!l);if(!l&&(V=='de'||V=='ma'||V=='cs'||V=='ad'))V='lb';render()};
mL.onclick=()=>{if(DEMO||OFFLINE||TOKEN)sm(1);else showLogin()};mV.onclick=()=>sm(0);boot();
</script></body></html>
